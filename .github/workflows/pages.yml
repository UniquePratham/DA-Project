name: Deploy Observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r dashboard/. _site/
          # The Flask dev server is not part of the static site.
          rm -f _site/app.py
          # GitHub Pages must not run Jekyll over the bundled assets.
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/static/app.css
          test -f _site/static/app.js
          test -f _site/static/dataset.js
          test -f _site/static/india_map.js
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
