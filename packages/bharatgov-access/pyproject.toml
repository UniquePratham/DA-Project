[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bharatgov-access"
version = "1.0.0"
description = "Census-scale dataset and analysis toolkit for India's public web infrastructure (12,092 government domains)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [
  { name = "Pratham Agarwal" },
  { name = "Amit Kumar Bairagi" },
  { name = "Vishwajeet Nand Yaduraj" },
]
keywords = [
  "e-governance",
  "digital-public-infrastructure",
  "web-accessibility",
  "wcag",
  "gigw",
  "core-web-vitals",
  "india",
  "open-data",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Sociology",
]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
bharatgov = "bharatgov_access.cli:main"

[project.urls]
Homepage = "https://github.com/UniquePratham/DA-Project"
Repository = "https://github.com/UniquePratham/DA-Project"
Documentation = "https://github.com/UniquePratham/DA-Project/blob/main/docs/DATA_DICTIONARY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bharatgov_access"]

[tool.hatch.build.targets.wheel.force-include]
"src/bharatgov_access/data/bharatgov_access_clean.parquet" = "bharatgov_access/data/bharatgov_access_clean.parquet"

[tool.hatch.build.targets.sdist]
include = [
  "src/bharatgov_access",
  "tests",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
