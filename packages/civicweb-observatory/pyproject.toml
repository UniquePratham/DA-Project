[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicweb-observatory"
version = "2.0.0"
description = "Cross-country measurement of public-sector web infrastructure: 2,143 government domains across 82 countries, each row carrying the vantage point that produced it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [
  { name = "Pratham Agarwal" },
  { name = "Amit Kumar Bairagi" },
  { name = "Vishwajeet Nand Yaduraj" },
]
keywords = [
  "e-governance",
  "digital-public-infrastructure",
  "web-accessibility",
  "wcag",
  "owasp",
  "core-web-vitals",
  "internet-measurement",
  "vantage-point",
  "global",
  "cross-country",
  "open-data",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Sociology",
]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
civicweb = "civicweb_observatory.cli:main"

[project.urls]
Homepage = "https://github.com/UniquePratham/DA-Project"
Repository = "https://github.com/UniquePratham/DA-Project"
Documentation = "https://github.com/UniquePratham/DA-Project/blob/main/docs/DATA_DICTIONARY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/civicweb_observatory"]

[tool.hatch.build.targets.wheel.force-include]
"src/civicweb_observatory/data/civicweb_observatory_global.parquet" = "civicweb_observatory/data/civicweb_observatory_global.parquet"

[tool.hatch.build.targets.sdist]
include = [
  "src/civicweb_observatory",
  "tests",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
